# Context_SocialMedia — collecteur multi-plateforme 2023–2026, 100 % local et gratuit.
# Tout tourne dans Docker : PostgreSQL + Ollama (Qwen 14B sur le GPU = le "cerveau") + collecteur.
#
#   docker compose up -d --build                     # tout démarre (le modèle est téléchargé au 1er lancement)
#   http://<ip-du-serveur>:8080                      # tableau de bord de l'avancement
#   docker compose logs -f collector                 # suivre la collecte
#   docker compose run --rm collector python -m collector stats
#   docker compose --profile tools run --rm export   # export Parquet -> ./data/export
#   Sans GPU : docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build

x-collector-env: &collector-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-collector}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-socialmedia}
  OLLAMA_URL: http://ollama:11434
  CONFIG_DIR: /app/config
  DATA_DIR: /app/data

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialmedia}
      POSTGRES_USER: ${POSTGRES_USER:-collector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collector} -d ${POSTGRES_DB:-socialmedia}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local LLM server (Qwen3 14B Q4 ≈ 9–10 GB VRAM on a 16 GB GPU)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: downloads the model into the ollama volume (skipped instantly if already there)
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:14b}"]
    restart: "no"

  collector:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    env_file: .env
    environment: *collector-env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data          # Parquet exports, Reddit dumps
    command: ${COLLECTOR_CMD:-python -m collector run --all --loop 6}

  # Web progress page: http://<server-ip>:8080  (aggregates only; set DASHBOARD_PASSWORD to protect it)
  dashboard:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment: *collector-env
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    command: python -m collector dashboard

  export:
    profiles: ["tools"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment: *collector-env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    command: python -m collector export

volumes:
  pgdata:
  ollama:
